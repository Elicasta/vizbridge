name: Build macOS VizBridge DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - name: Create required Tauri icon
        run: |
          mkdir -p src-tauri/icons
          python3 - <<'PY'
          import struct,zlib
          w=h=32
          raw=b''.join(b'\x00'+bytes([35,35,38,255])*w for _ in range(h))
          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack(">IIBBBBB",w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          open("src-tauri/icons/icon.png","wb").write(png)
          PY
      - run: npm run tauri build
      - name: Rename DMG
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          cp "$DMG" VizBridge-0.2.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: VizBridge-macOS-dmg
          path: VizBridge-0.2.0-macOS.dmg
          if-no-files-found: error
      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 >/dev/null 2>&1 || gh release create v0.2.0 --title "VizBridge 0.2.0" --notes "VizBridge Art-Net fan-out bridge for LumaViz."
          gh release upload v0.2.0 VizBridge-0.2.0-macOS.dmg --clobber
